<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline iconográfica do Índice de Potencial Bancário</title>
  <desc id="desc">Fluxo de nove fontes públicas por ingestores Python, cache Parquet e GCS, BigQuery raw, preparação trusted e produtos analytics.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#071f2e" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12b8c4"/>
    </marker>
    <style>
      .label{font-family:Segoe UI,Arial,sans-serif;fill:#687983;font-size:9px;font-weight:700;letter-spacing:1px}
      .title{font-family:Segoe UI,Arial,sans-serif;fill:#071f2e;font-size:17px;font-weight:750}
      .body{font-family:Segoe UI,Arial,sans-serif;fill:#60737d;font-size:11px}
      .code{font-family:Consolas,Menlo,monospace;fill:#304854;font-size:10px}
      .number{font-family:Segoe UI,Arial,sans-serif;fill:#a9bbc1;font-size:10px;font-weight:800}
      .dark-title{font-family:Segoe UI,Arial,sans-serif;fill:#ffffff;font-size:17px;font-weight:750}
      .dark-body{font-family:Segoe UI,Arial,sans-serif;fill:#bcd2d9;font-size:11px}
      .dark-code{font-family:Consolas,Menlo,monospace;fill:#cfe2e7;font-size:10px}
    </style>
  </defs>

  <!-- entradas -->
  <g transform="translate(20 8)">
    <rect width="188" height="46" rx="23" fill="#dff4f5"/>
    <circle cx="24" cy="23" r="13" fill="#12b8c4"/>
    <path d="M18 23h12M24 17v12" stroke="#071f2e" stroke-width="2" stroke-linecap="round"/>
    <text x="45" y="20" class="title" font-size="15">6 APIs</text>
    <text x="45" y="35" class="body" font-size="11">IBGE · BCB · Ipeadata</text>
  </g>
  <text x="220" y="38" class="title" font-size="18">+</text>
  <g transform="translate(246 8)">
    <rect width="208" height="46" rx="23" fill="#fff0d4"/>
    <path d="M18 13h18l7 7v17H18z" fill="none" stroke="#b67619" stroke-width="2"/><path d="M36 13v8h7" fill="none" stroke="#b67619" stroke-width="2"/>
    <text x="54" y="20" class="title" font-size="15">3 arquivos</text>
    <text x="54" y="35" class="body" font-size="11">PIB · Estban · Anatel</text>
  </g>
  <g transform="translate(972 8)">
    <rect width="208" height="46" rx="7" fill="#071f2e"/>
    <text x="18" y="21" font-family="Segoe UI,Arial,sans-serif" fill="#ffffff" font-size="15" font-weight="750">9 fontes públicas</text>
    <text x="18" y="36" font-family="Segoe UI,Arial,sans-serif" fill="#9db7c0" font-size="11">rastreáveis e auditáveis</text>
  </g>

  <!-- conectores -->
  <g fill="none" stroke="#12b8c4" stroke-width="3" marker-end="url(#arrow)">
    <path d="M220 214h24"/><path d="M452 214h24"/><path d="M684 214h24"/><path d="M916 214h24"/>
  </g>

  <!-- 01 Python coleta -->
  <g transform="translate(20 76)" filter="url(#shadow)">
    <rect width="200" height="276" rx="10" fill="#ffffff"/>
    <rect width="200" height="5" rx="2.5" fill="#12b8c4"/>
    <text x="174" y="28" class="number">01</text>
    <g transform="translate(18 26)">
      <rect width="62" height="62" rx="15" fill="#dff4f5"/>
      <rect x="12" y="13" width="38" height="30" rx="5" fill="none" stroke="#087c86" stroke-width="2.5"/>
      <path d="M12 22h38" stroke="#087c86" stroke-width="2.5"/>
      <circle cx="19" cy="18" r="1.7" fill="#087c86"/><circle cx="25" cy="18" r="1.7" fill="#087c86"/>
      <path d="M22 31l5 4-5 4M32 39h8" fill="none" stroke="#087c86" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="48" cy="48" r="12" fill="#f2b84b"/><text x="48" y="52" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="900" fill="#071f2e">PY</text>
    </g>
    <text x="18" y="111" class="label">PYTHON · COLETA</text>
    <text x="18" y="140" class="title">Ingestores</text>
    <text x="18" y="163" class="code">src/ingestors/*.py</text>
    <line x1="18" y1="180" x2="182" y2="180" stroke="#dbe5e8"/>
    <text x="18" y="204" class="body">requests · pandas</text>
    <text x="18" y="226" class="body">validação · retry</text>
    <text x="18" y="250" class="body" font-weight="700">coletar()</text>
  </g>

  <!-- 02 Parquet e GCS -->
  <g transform="translate(252 76)" filter="url(#shadow)">
    <rect width="200" height="276" rx="10" fill="#ffffff"/>
    <rect width="200" height="5" rx="2.5" fill="#f2b84b"/>
    <text x="174" y="28" class="number">02</text>
    <g transform="translate(18 26)">
      <rect width="62" height="62" rx="15" fill="#fff0d4"/>
      <path d="M14 42h35a10 10 0 0 0 0-20 16 16 0 0 0-30-3 12 12 0 0 0-5 23z" fill="none" stroke="#a86a14" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M22 47l9 4 9-4M22 52l9 4 9-4" fill="none" stroke="#a86a14" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="18" y="111" class="label">ESTÁGIO IDEMPOTENTE</text>
    <text x="18" y="140" class="title">Parquet + GCS</text>
    <text x="18" y="163" class="code">data/raw/ · gs://</text>
    <line x1="18" y1="180" x2="182" y2="180" stroke="#dbe5e8"/>
    <text x="18" y="204" class="body">cache antes da carga</text>
    <text x="18" y="226" class="body">fontes manuais no bucket</text>
    <text x="18" y="250" class="body" font-weight="700">zero retrabalho</text>
  </g>

  <!-- 03 BigQuery raw -->
  <g transform="translate(484 76)" filter="url(#shadow)">
    <rect width="200" height="276" rx="10" fill="#071f2e"/>
    <rect width="200" height="5" rx="2.5" fill="#f2b84b"/>
    <text x="174" y="28" font-family="Segoe UI,Arial" fill="#7996a0" font-size="12" font-weight="800">03</text>
    <g transform="translate(18 26)">
      <rect width="62" height="62" rx="15" fill="#123b4c"/>
      <ellipse cx="31" cy="18" rx="18" ry="7" fill="none" stroke="#f2b84b" stroke-width="2.5"/>
      <path d="M13 18v25c0 4 8 7 18 7s18-3 18-7V18M13 31c0 4 8 7 18 7s18-3 18-7" fill="none" stroke="#f2b84b" stroke-width="2.5"/>
    </g>
    <text x="18" y="111" font-family="Segoe UI,Arial" fill="#f2b84b" font-size="12" font-weight="800" letter-spacing="1.3">BIGQUERY · US</text>
    <text x="18" y="140" class="dark-title">raw_</text>
    <text x="18" y="163" class="dark-code">próximo à origem</text>
    <line x1="18" y1="180" x2="182" y2="180" stroke="#31515d"/>
    <text x="18" y="204" class="dark-body">tipos e chaves auditáveis</text>
    <text x="18" y="226" class="dark-body">5.570 municípios</text>
    <text x="18" y="250" class="dark-body" font-weight="700">dataset ipb_staging</text>
  </g>

  <!-- 04 trusted -->
  <g transform="translate(716 76)" filter="url(#shadow)">
    <rect width="200" height="276" rx="10" fill="#ffffff"/>
    <rect width="200" height="5" rx="2.5" fill="#12b8c4"/>
    <text x="174" y="28" class="number">04</text>
    <g transform="translate(18 26)">
      <rect width="62" height="62" rx="15" fill="#dff4f5"/>
      <path d="M16 19h30M16 31h30M16 43h30" stroke="#087c86" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="26" cy="19" r="4" fill="#f2b84b" stroke="#087c86" stroke-width="2"/>
      <circle cx="39" cy="31" r="4" fill="#f2b84b" stroke="#087c86" stroke-width="2"/>
      <circle cx="22" cy="43" r="4" fill="#f2b84b" stroke="#087c86" stroke-width="2"/>
      <circle cx="49" cy="49" r="11" fill="#071f2e"/><text x="49" y="53" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" font-weight="900" fill="#12b8c4">PY</text>
    </g>
    <text x="18" y="111" class="label">PYTHON · PREPARAÇÃO</text>
    <text x="18" y="140" class="title">trusted_</text>
    <text x="18" y="163" class="code">trusted_municipios.py</text>
    <line x1="18" y1="180" x2="182" y2="180" stroke="#dbe5e8"/>
    <text x="18" y="204" class="body">joins · taxas · estratos</text>
    <text x="18" y="226" class="body">winsorize · log1p</text>
    <text x="18" y="250" class="body" font-weight="700">base limpa e tipada</text>
  </g>

  <!-- 05 analytics -->
  <g transform="translate(948 76)" filter="url(#shadow)">
    <rect width="232" height="276" rx="10" fill="#e8f6f6"/>
    <rect width="232" height="5" rx="2.5" fill="#f2b84b"/>
    <text x="205" y="28" class="number">05</text>
    <g transform="translate(18 26)">
      <rect width="62" height="62" rx="15" fill="#f2b84b"/>
      <path d="M15 46h34M19 42V31h8v11M31 42V23h8v19M43 42V15h8v27" fill="none" stroke="#071f2e" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M17 21l10-7 9 4 14-9" fill="none" stroke="#071f2e" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="18" y="111" class="label">PYTHON · PRODUTO</text>
    <text x="18" y="140" class="title">analytics_</text>
    <text x="18" y="163" class="code">ipb.py · modelagem.py</text>
    <line x1="18" y1="180" x2="214" y2="180" stroke="#c9e4e6"/>
    <text x="18" y="204" class="body">IPB V1/V2/V3 · clusters</text>
    <text x="18" y="226" class="body">ranking · JSON · Plotly</text>
    <text x="18" y="250" class="body" font-weight="700">mapa e site interativo</text>
  </g>

  <!-- faixa de governança -->
  <g transform="translate(20 378)">
    <rect width="1160" height="64" rx="9" fill="#071f2e"/>
    <line x1="386" y1="14" x2="386" y2="50" stroke="#244653"/>
    <line x1="773" y1="14" x2="773" y2="50" stroke="#244653"/>
    <circle cx="24" cy="32" r="9" fill="#12b8c4"/><path d="M20 32l3 3 6-7" fill="none" stroke="#071f2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="29" font-family="Segoe UI,Arial" fill="#12b8c4" font-size="13" font-weight="800">TESTES</text>
    <text x="42" y="45" font-family="Segoe UI,Arial" fill="#bcd2d9" font-size="12">unitários + integridade das tabelas</text>
    <circle cx="410" cy="32" r="9" fill="#f2b84b"/><path d="M406 32h8M410 28v8" stroke="#071f2e" stroke-width="2"/>
    <text x="428" y="29" font-family="Segoe UI,Arial" fill="#f2b84b" font-size="13" font-weight="800">RASTREABILIDADE</text>
    <text x="428" y="45" font-family="Segoe UI,Arial" fill="#bcd2d9" font-size="12">fonte → tabela → índice</text>
    <circle cx="797" cy="32" r="9" fill="#12b8c4"/><path d="M792 34l4-4 3 3 5-6" fill="none" stroke="#071f2e" stroke-width="2"/>
    <text x="815" y="29" font-family="Segoe UI,Arial" fill="#12b8c4" font-size="13" font-weight="800">SAÍDA</text>
    <text x="815" y="45" font-family="Segoe UI,Arial" fill="#bcd2d9" font-size="12">ranking · mapa · arquétipos · oportunidades</text>
  </g>
</svg>

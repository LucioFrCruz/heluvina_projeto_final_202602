[tool.poetry]
name = "ipb-coleta"
version = "0.1.0"
description = "Ingestão e Coleta de Dados (IPB)"
authors = ["Equipe"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.2.0"
pyarrow = "^15.0.0"
google-cloud-bigquery = "^3.18.0"
google-cloud-bigquery-storage = "^2.24.0"
requests = "^2.31.0"
python-dotenv = "^1.0.1"
openpyxl = "^3.1.2"
pydantic-settings = "^2.2.0"
google-cloud-storage = "<2.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
ruff = "^0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
